name: Production Deployment
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: gd, zip

      - name: Install composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-progress

      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-site
          include-hidden-files: true
          path: |
            .
            !.git
            !.zed
            !.ddev
            !.husky
            !src
            !node_modules
            !content/**
            !storage/**
            !pnpm-workspace.yaml
            !pnpm-lock.yaml
            !package.json
            !vite.config.js
            !tsconfig.json
            !lint-staged.config.js
            !.editorconfig
            !.oxfmtrc.json
            !.phpactor.json
            !.php-cs-fixer.dist.php
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: built-site

      - name: FTP Deployment
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.ftp_server }}
          username: ${{ secrets.ftp_user }}
          password: ${{ secrets.ftp_password }}
          protocol: ftps
          port: 21
          timeout: 3600000
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            content/**
            storage/**
            public/media/**
            .ddev/**
            .husky/**
            .zed/**
            src/**
            pnpm-workspace.yaml
            pnpm-lock.yaml
            package.json
            vite.config.js
            tsconfig.json
            lint-staged.config.js
            .editorconfig
            .oxfmtrc.json
            composer.lock
            .phpactor.json
            .php-cs-fixer.dist.php

  clear-cache:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cache Clearing
        run: |
          sleep 5
          curl -f -L -X POST \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --retry 3 --retry-delay 5 \
            "https://benoitmounier.fr/clear-my-cache-pretty-please/${{ secrets.DEPLOY_TOKEN }}"

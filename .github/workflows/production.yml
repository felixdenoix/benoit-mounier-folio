name: Production Deployment
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: gd, zip

      - name: Install composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-progress

      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-site
          include-hidden-files: true
          path: |
            .
            !.git
            !.zed
            !.ddev
            !.husky
            !src
            !node_modules
            !content/**
            !storage/**
            !pnpm-workspace.yaml
            !pnpm-lock.yaml
            !package.json
            !vite.config.js
            !tsconfig.json
            !lint-staged.config.js
            !.editorconfig
            !.oxfmtrc.json
            !.phpactor.json
            !.php-cs-fixer.dist.php
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: built-site

      - name: FTP Deployment
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.ftp_server }}
          username: ${{ secrets.ftp_user }}
          password: ${{ secrets.ftp_password }}
          protocol: ftps
          port: 21
          timeout: 3600000
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            content/**
            storage/**
            public/media/**
            .ddev/**
            .husky/**
            .zed/**
            src/**
            pnpm-workspace.yaml
            pnpm-lock.yaml
            package.json
            vite.config.js
            tsconfig.json
            lint-staged.config.js
            .editorconfig
            .oxfmtrc.json
            composer.lock
            .phpactor.json
            .php-cs-fixer.dist.php

  clear-cache:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Clean Cache Files
        run: |
          lftp -u "${{ secrets.ftp_user }}","${{ secrets.ftp_password }}" "${{ secrets.ftp_server }}" <<EOF
          set net:timeout 10
          set net:max-retries 2
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-auth TLS
          set ssl:verify-certificate false
          set ssl:check-hostname false
          set ftp:passive-mode true
          cd /storage/cache
          rm -rf benoitmounier.fr/pages
          rm -rf www.benoitmounier.fr/pages
          rm -rf benoit.felixdenoix.fr/pages
          bye
          EOF
